<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Fragment 1: <head>, receives the page title -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Eventify Admin'">Eventify Admin</title>
    <style>
        body  { font-family: sans-serif; margin: 0 2rem; }
        nav a { margin-right: 1rem; }
        table { border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        .error   { color: #c00; }
        .error::before { content: "⚠ "; }
        /* Campo con error de validacion: lo agrega th:errorclass */
        .campo-invalido { border: 2px solid #c00; background: #fff5f5; }
        /* Mensajes flash: verde = exito, rojo = error */
        .alert { padding: .75rem 1rem; border-radius: 4px; max-width: 40rem; font-weight: bold; }
        .alert-success { color: #155724; background: #d4edda; border: 1px solid #c3e6cb; }
        .alert-error   { color: #721c24; background: #f8d7da; border: 1px solid #f5c6cb; }
        form.inline { display: inline; }
        form.filters { display: flex; flex-wrap: wrap; gap: .5rem 1rem; align-items: end; margin-bottom: 1rem; }
        form.filters label { display: flex; flex-direction: column; font-size: .9rem; }
        fieldset { margin-bottom: 1rem; max-width: 40rem; }
        label.checkbox { display: inline-block; margin-right: 1rem; }
        nav.pager { margin: 1rem 0; display: flex; gap: 1rem; }
        nav.pager .disabled { color: #aaa; cursor: not-allowed; }
    </style>
</head>

<body>

<!-- Fragment 2: navigation bar -->
<nav th:fragment="navbar">
    <h2>Eventify Admin</h2>
    <a th:href="@{/admin}">Inicio</a>
    <a th:href="@{/admin/events}">Eventos</a>
    <a th:href="@{/admin/venues}">Lugares</a>
    <hr>
</nav>

<!-- Fragment 3: mensajes flash (llegan con RedirectAttributes.addFlashAttribute) -->
<div th:fragment="flash">
    <p class="alert alert-success" th:if="${successMessage}" th:text="'✔ ' + ${successMessage}">Mensaje de éxito</p>
    <p class="alert alert-error" th:if="${errorMessage}" th:text="'✖ ' + ${errorMessage}">Mensaje de error</p>
</div>

</body>
</html>
