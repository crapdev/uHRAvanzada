spring.application.name=EventifyT

# --- Base de datos (PostgreSQL en Docker) ---
spring.datasource.url=jdbc:postgresql://localhost:5435/eventify
spring.datasource.username=cristian
spring.datasource.password=123.qwe**

# --- Flyway: es el UNICO dueno del esquema (scripts en db/migration) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- JPA / Hibernate ---
# validate: Hibernate NO crea ni modifica tablas, solo comprueba que las entidades coincidan con el esquema de Flyway
spring.jpa.hibernate.ddl-auto=validate
# Cerramos la sesion al terminar el servicio: obliga a cargar las relaciones de forma explicita (JOIN FETCH / EntityGraph)
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# --- Auditoria SQL ---
# Sentencias SQL formateadas (reemplaza a show-sql, que imprime con System.out y sin formato)
logging.level.org.hibernate.SQL=DEBUG
# Valores reales de los parametros (?) de cada sentencia
# Hibernate 6 usa este logger...
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# ...y este es el nombre clasico de Hibernate 5 (BasicBinder)
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- Thymeleaf ---
# Development only: reload templates on every request
spring.thymeleaf.cache=false

# --- Swagger / OpenAPI: document only the REST API ---
springdoc.paths-to-match=/api/**
springdoc.packages-to-scan=com.riwi.eventifyt.controller.api
