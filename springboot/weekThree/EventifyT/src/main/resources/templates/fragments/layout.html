<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<!-- Fragment 1: <head>, receives the page title -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | Eventify Admin'">Eventify Admin</title>
    <style>
        body  { font-family: sans-serif; margin: 0 2rem; }
        nav a { margin-right: 1rem; }
        table { border-collapse: collapse; }
        th, td { border: 1px solid #ccc; padding: 6px 10px; text-align: left; }
        .error   { color: #c00; }
        .success { color: #080; font-weight: bold; }
        form.inline { display: inline; }
    </style>
</head>

<body>

<!-- Fragment 2: navigation bar -->
<nav th:fragment="navbar">
    <h2>Eventify Admin</h2>
    <a th:href="@{/admin}">Inicio</a>
    <a th:href="@{/admin/events}">Eventos</a>
    <a th:href="@{/admin/venues}">Lugares</a>
    <hr>
</nav>

<!-- Fragment 3: success message (flash attribute) -->
<p th:fragment="flash" class="success"
   th:if="${successMessage}" th:text="${successMessage}">
    Mensaje de éxito
</p>

</body>
</html>
